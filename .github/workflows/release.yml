name: Release and Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check npm version availability
        run: |
          bun - <<'JS'
            import pkg from "./package.json";
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`);
            if (response.ok) throw new Error(`${pkg.name}@${pkg.version} is already published`);
            if (response.status !== 404) throw new Error(`npm registry returned HTTP ${response.status}`);
          JS
      - name: Publish to npm
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NPM_CONFIG_TOKEN" || { echo 'NPM_TOKEN is required'; exit 1; }
          bun publish --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(bun -p 'require("./package.json").version')
          gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes
